name: Quality gate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c
    with:
      python-version: '3.11'
      install-dependencies: true
      run-lint: false
      run-type-check: false
      test-args: tests -q
      # Preserve the existing test requirement; collect coverage without adding
      # an arbitrary new threshold during the workflow migration.
      coverage-threshold: 0
      coverage-artifact-name: echomuse-python-coverage

  security:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@6b2d99519d513d2b871d2a845ddd6134dea4af2c
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: true
      run-dependency-review: true

  source:
    name: Public source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate Python, upstream lock, and public files
        run: |
          python -m compileall -q scripts tests custom_components training
          python -m json.tool upstream-lock.json > /dev/null
          python scripts/check_public.py
          python scripts/check_docs.py
      - name: Validate intents in an isolated Home Assistant runtime
        run: >-
          docker run --rm --network none
          --entrypoint python3
          -v "$PWD:/work:ro" -w /work
          ghcr.io/home-assistant/home-assistant:2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
          -m unittest discover -s tests -p 'runtime_*.py'

  training:
    name: Synthetic training and ONNX export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the CPU training stack
        run: |
          torch_requirement=$(sed -n '/^torch==/p' training/requirements.txt)
          test -n "$torch_requirement"
          python -m pip install "$torch_requirement" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements.txt
      - name: Train and export synthetic features without recordings
        run: python training/smoke_oww.py

  gate:
    name: CI gate
    needs: [python, security, source, training]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Require all validation jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'python', 'security', 'source', 'training'}
          if set(results) != expected:
              raise SystemExit('Validation job inventory differs')
          failed = {name: value['result'] for name, value in results.items()
                    if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          print('All validation jobs passed.')
