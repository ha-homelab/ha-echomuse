name: Accept EchoMuse bot invitation
on:
  pull_request:
    types: [synchronize]
permissions: {}
jobs:
  accept:
    if: >-
      github.repository == 'ha-homelab/ha-echomuse' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == '4alvit' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Temporary onboarding only. No checkout, PR input, or token export.
      - name: Accept only the provisioned EchoMuse invitation
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        shell: python3 -I {0}
        run: |
          import json, subprocess
          def api(path, method='GET'):
              result = subprocess.run(['gh', 'api', '--method', method, path],
                                      text=True, capture_output=True, check=True)
              return json.loads(result.stdout) if result.stdout.strip() else None
          assert api('user')['login'] == 'californiantiramisu'
          pages = json.loads(subprocess.check_output(
              ['gh', 'api', '--paginate', '--slurp', 'user/repository_invitations?per_page=100'],
              text=True))
          matches = [item for page in pages for item in page
                     if item['id'] == 337760397
                     and item['repository']['id'] == 1418316560
                     and item['repository']['full_name'] == 'ha-homelab/ha-echomuse'
                     and item['permissions'] == 'write']
          assert len(matches) == 1, 'Expected the single provisioned invitation'
          api('user/repository_invitations/337760397', 'PATCH')
          assert api('repos/ha-homelab/ha-echomuse')['permissions']['push']
          print('EchoMuse invitation accepted by the verified bot account.')
