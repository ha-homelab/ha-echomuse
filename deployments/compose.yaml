name: ha-echomuse

services:
  controller:
    # Upstream GA controller 2.26.0. Firmware uses a separate version track.
    image: ghcr.io/wilbowes/echomuse-controller:2.27.0@sha256:f0cab64d198bfb9b2fae07b5686f30cb78bc6f5ff525d0d747c2ed21ae6227ac
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./controller-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8768/api/system/setup-state', timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s
