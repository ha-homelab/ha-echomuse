<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" role="img" aria-labelledby="title desc">
<title id="title">What a working result looks like</title><desc id="desc">Six acceptance targets cover audible voice, home actions, statistics, music, optional Bluetooth and recovery. These are checks to perform, not green status indicators or new test results.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#758399"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#758399;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="0" y="0" width="1280" height="970" rx="24" fill="#f7f9fd"/>
<rect x="0" y="0" width="1280" height="9" rx="0" fill="#6d4ad1"/>
<text x="60" y="49" font-size="14" fill="#6d4ad1" font-weight="700">03 / ACCEPTANCE TARGETS</text>
<text x="60" y="96" font-size="35" fill="#172b4d" font-weight="700">What a working result looks like</text>
<text x="60" y="132" font-size="18" fill="#4b6178">Run on each Dot separately · these cards are a checklist, not a report that every check passed</text>
<rect x="60" y="175" width="360" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="61" y="176" width="358" height="47" rx="17" fill="#f0ebff"/>
<text x="82" y="205" font-size="14" fill="#6d4ad1" font-weight="700">VOICE</text>
<text x="82" y="257" font-size="24" fill="#172b4d" font-weight="700">A complete spoken answer</text>
<text x="82" y="291" font-size="18" fill="#304a64">Press the action button and ask.</text>
<text x="82" y="317" font-size="18" fill="#304a64">Then repeat with the wake phrase.</text>
<text x="82" y="343" font-size="18" fill="#304a64">PASS WHEN: the same Dot gives</text>
<text x="82" y="369" font-size="18" fill="#304a64">an intelligible, complete answer.</text>
<rect x="460" y="175" width="360" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="461" y="176" width="358" height="47" rx="17" fill="#e2f6f1"/>
<text x="482" y="205" font-size="14" fill="#087f78" font-weight="700">HOME ACTIONS</text>
<text x="482" y="257" font-size="24" fill="#172b4d" font-weight="700">Only the chosen device</text>
<text x="482" y="291" font-size="18" fill="#304a64">Choose one known light or switch.</text>
<text x="482" y="317" font-size="18" fill="#304a64">Check its area and allowed targets.</text>
<text x="482" y="343" font-size="18" fill="#304a64">PASS WHEN: only the intended</text>
<text x="482" y="369" font-size="18" fill="#304a64">device changes, confirmed in HA.</text>
<rect x="860" y="175" width="360" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="861" y="176" width="358" height="47" rx="17" fill="#e8f1ff"/>
<text x="882" y="205" font-size="14" fill="#2563a6" font-weight="700">STATISTICS</text>
<text x="882" y="257" font-size="24" fill="#172b4d" font-weight="700">A value with context</text>
<text x="882" y="291" font-size="18" fill="#304a64">Ask for a state or time interval.</text>
<text x="882" y="317" font-size="18" fill="#304a64">Compare units and source in HA.</text>
<text x="882" y="343" font-size="18" fill="#304a64">PASS WHEN: the answer matches</text>
<text x="882" y="369" font-size="18" fill="#304a64">the state or Recorder statistics.</text>
<rect x="60" y="470" width="360" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="61" y="471" width="358" height="47" rx="17" fill="#ffebf2"/>
<text x="82" y="500" font-size="14" fill="#af3e68" font-weight="700">MUSIC</text>
<text x="82" y="552" font-size="24" fill="#172b4d" font-weight="700">Audio and queue agree</text>
<text x="82" y="586" font-size="18" fill="#304a64">Play, cross a track boundary, stop.</text>
<text x="82" y="612" font-size="18" fill="#304a64">Use the originating Dot’s queue.</text>
<text x="82" y="638" font-size="18" fill="#304a64">PASS WHEN: playback stays clear</text>
<text x="82" y="664" font-size="18" fill="#304a64">and the intended queue stops.</text>
<rect x="460" y="470" width="360" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="461" y="471" width="358" height="47" rx="17" fill="#fff2d9"/>
<text x="482" y="500" font-size="14" fill="#a85a06" font-weight="700">BLUETOOTH / OPTIONAL</text>
<text x="482" y="552" font-size="24" fill="#172b4d" font-weight="700">BLE data reaches HA</text>
<text x="482" y="586" font-size="18" fill="#304a64">Enroll the separate BLE endpoint.</text>
<text x="482" y="612" font-size="18" fill="#304a64">Check scanner and advertisements.</text>
<text x="482" y="638" font-size="18" fill="#304a64">PASS WHEN: HA receives BLE data;</text>
<text x="482" y="664" font-size="18" fill="#304a64">a tracker may still have no device.</text>
<rect x="860" y="470" width="360" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="861" y="471" width="358" height="47" rx="17" fill="#edf2f7"/>
<text x="882" y="500" font-size="14" fill="#4b6178" font-weight="700">RECONNECT AND RECOVERY</text>
<text x="882" y="552" font-size="24" fill="#172b4d" font-weight="700">A repeatable restart</text>
<text x="882" y="586" font-size="18" fill="#304a64">Keep this device’s backup private.</text>
<text x="882" y="612" font-size="18" fill="#304a64">Test an attended power cycle.</text>
<text x="882" y="638" font-size="18" fill="#304a64">PASS WHEN: links recover and</text>
<text x="882" y="664" font-size="18" fill="#304a64">a new voice request succeeds.</text>
<rect x="60" y="754" width="1160" height="140" rx="18" fill="#172b4d"/>
<text x="84" y="791" font-size="14" fill="#b7d8ff" font-weight="700">KEEP THREE SEPARATE RECEIPTS</text>
<text x="84" y="831" font-size="24" fill="#ffffff" font-weight="700">Configuration saved     →     Protocol verified     →     Heard by a person</text>
<text x="84" y="865" font-size="18" fill="#dbe8fa">Record version, device, conditions and outcome. An offline device cannot pass an audible test.</text>
<text x="60" y="946" font-size="14" fill="#4b6178">EchoMuse project guide · recorded baseline, not live device status</text>
</svg>
