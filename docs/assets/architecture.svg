<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">EchoMuse deployment architecture</title><desc id="desc">A Dot running emOS and EchoMuse connects over WSS to its controller, which exposes a voice endpoint to Home Assistant. Home Assistant uses a local household model and local Silero speech, but FCC speech recognition is external. A separate encrypted BLE proxy feeds Home Assistant Bluetooth and optional iBeacon Tracker. Music uses a separate Music Assistant queue.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526680"/></marker></defs>
<rect width="1200" height="1020" rx="24" fill="#f5f8fc"/>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;} .h {font-size:34px;font-weight:700;fill:#172b4d} .k {font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#486680} .t {font-size:23px;font-weight:700;fill:#172b4d} .b {font-size:18px;fill:#284564} .s {font-size:16px;fill:#425e78} .edge {fill:none;stroke:#526680;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="50" y="52" class="k">ECHOMUSE / HOME ASSISTANT</text>
<text x="50" y="100" class="h">One speaker, distinct service paths</text>
<text x="50" y="130" class="s">Pinned baseline: emOS 0.10 · device 2.18.0 · controller 2.26.0</text>
<rect x="50" y="175" width="300" height="140" rx="16" fill="#e8f4f3" stroke="#a2cfca" stroke-width="1.5"/>
<text x="72" y="213" class="t">Echo Dot 2</text>
<text x="72" y="249" class="b">Local wake detection</text>
<text x="72" y="275" class="b">Microphone · speaker · LEDs</text>
<rect x="450" y="175" width="300" height="140" rx="16" fill="#ffffff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="472" y="213" class="t">EchoMuse Controller</text>
<text x="472" y="249" class="b">Device approval + Console</text>
<text x="472" y="275" class="b">One voice endpoint per Dot</text>
<rect x="850" y="175" width="300" height="140" rx="16" fill="#ffffff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="872" y="213" class="t">Home Assistant</text>
<text x="872" y="249" class="b">ESPHome voice + Assist</text>
<text x="872" y="275" class="b">Pipeline + native commands</text>
<path class="edge" d="M350 242 H445"/>
<text x="366" y="226" class="s">WSS</text>
<path class="edge" d="M750 242 H845"/>
<text x="763" y="225" class="s">Voice API</text>
<path class="edge" d="M1000 315 V375 H200 V450"/>
<path class="edge" d="M1000 315 V375 H600 V450"/>
<path class="edge" d="M1000 315 V450" stroke-dasharray="7 5"/>
<text x="50" y="350" class="k">ASSIST SERVICES</text>
<rect x="50" y="455" width="300" height="160" rx="16" fill="#e8f4f3" stroke="#a2cfca" stroke-width="1.5"/>
<text x="72" y="493" class="t">Local home services</text>
<text x="72" y="529" class="b">Native intents + Ollama</text>
<text x="72" y="555" class="b">HA tools · Recorder · IGW</text>
<text x="72" y="581" class="b">No cloud model fallback</text>
<rect x="450" y="455" width="300" height="160" rx="16" fill="#e8f4f3" stroke="#a2cfca" stroke-width="1.5"/>
<text x="472" y="493" class="t">Local Russian speech</text>
<text x="472" y="529" class="b">Wyoming adapter + Baya</text>
<text x="472" y="555" class="b">Sentence streaming</text>
<text x="472" y="581" class="b">Text to spoken audio</text>
<rect x="850" y="455" width="300" height="160" rx="16" fill="#fff2df" stroke="#dec19b" stroke-width="1.5"/>
<text x="872" y="493" class="t">Cloud recognition</text>
<text x="872" y="529" class="b">Configured FCC service</text>
<text x="872" y="555" class="b">Spoken requests leave home</text>
<text x="872" y="581" class="b">Audio to transcript</text>
<text x="50" y="655" class="s">Local conversation and synthesis do not make this an offline voice pipeline.</text>
<text x="50" y="703" class="k">OPTIONAL BLUETOOTH — A SEPARATE ENDPOINT</text>
<rect x="50" y="730" width="300" height="120" rx="16" fill="#e8f4f3" stroke="#a2cfca" stroke-width="1.5"/>
<text x="72" y="768" class="t">Dot BLE scanner</text>
<text x="72" y="804" class="b">Receives advertisements</text>
<text x="72" y="830" class="b">Optional active connections</text>
<rect x="450" y="730" width="300" height="120" rx="16" fill="#ffffff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="472" y="768" class="t">Encrypted BLE proxy</text>
<text x="472" y="804" class="b">Controller port + Noise key</text>
<text x="472" y="830" class="b">Independent HA enrollment</text>
<rect x="850" y="730" width="300" height="120" rx="16" fill="#ffffff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="872" y="768" class="t">HA Bluetooth</text>
<text x="872" y="804" class="b">Sensor integrations</text>
<text x="872" y="830" class="b">Optional iBeacon Tracker</text>
<path class="edge" d="M350 786 H445"/>
<path class="edge" d="M750 786 H845"/>
<rect x="50" y="888" width="1100" height="78" rx="16" fill="#e7edf8"/>
<text x="72" y="917" class="k">MUSIC HAS ITS OWN QUEUE AND SOURCE</text>
<text x="72" y="946" class="b">Library &gt; Music Assistant &gt; EchoMuse player / controller &gt; Dot</text>
<text x="50" y="992" class="s">Voice API and Wyoming are trusted-network links; the dashed branch is the configured external service.</text>
</svg>
