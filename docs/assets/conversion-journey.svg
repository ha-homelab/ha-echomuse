<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
<title id="title">From stored Echo to a room assistant</title><desc id="desc">Six ordered stages: identify the Dot 2, preserve recovery, prepare the controller, migrate over USB, enroll current HA endpoints, and verify audible results. Stop before migration if identity or recovery cannot be verified.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#758399"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .edge{fill:none;stroke:#758399;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="0" y="0" width="1280" height="960" rx="24" fill="#f7f9fd"/>
<rect x="0" y="0" width="1280" height="9" rx="0" fill="#6d4ad1"/>
<text x="60" y="49" font-size="14" fill="#6d4ad1" font-weight="700">01 / CONVERSION JOURNEY</text>
<text x="60" y="96" font-size="35" fill="#172b4d" font-weight="700">From stored Echo to a room assistant</text>
<text x="60" y="132" font-size="18" fill="#4b6178">Process overview · Echo Dot 2 / RS03QR · follow the full runbook before writing flash</text>
<path class="edge" d="M420 285 H456"/>
<path class="edge" d="M820 285 H856"/>
<path class="edge" d="M1040 395 V438 H240 V480"/>
<path class="edge" d="M420 590 H456"/>
<path class="edge" d="M820 590 H856"/>
<rect x="60" y="175" width="360" height="220" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="61" y="176" width="358" height="47" rx="17" fill="#f0ebff"/>
<text x="82" y="205" font-size="14" fill="#6d4ad1" font-weight="700">1 / IDENTIFY</text>
<text x="82" y="257" font-size="24" fill="#172b4d" font-weight="700">Confirm the hardware</text>
<text x="82" y="291" font-size="18" fill="#304a64">Read the model and installed OS.</text>
<text x="82" y="317" font-size="18" fill="#304a64">Check the partition layout.</text>
<text x="82" y="343" font-size="18" fill="#304a64">Result: the runbook matches.</text>
<text x="82" y="369" font-size="18" fill="#304a64">Other Echo models: stop here.</text>
<rect x="460" y="175" width="360" height="220" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="461" y="176" width="358" height="47" rx="17" fill="#fff2d9"/>
<text x="482" y="205" font-size="14" fill="#a85a06" font-weight="700">2 / PRESERVE</text>
<text x="482" y="257" font-size="24" fill="#172b4d" font-weight="700">Keep a way back</text>
<text x="482" y="291" font-size="18" fill="#304a64">Use a tested USB data cable.</text>
<text x="482" y="317" font-size="18" fill="#304a64">Save this device’s recovery copy.</text>
<text x="482" y="343" font-size="18" fill="#304a64">Check that the backup is readable.</text>
<text x="482" y="369" font-size="18" fill="#304a64">No verified recovery: do not flash.</text>
<rect x="860" y="175" width="360" height="220" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="861" y="176" width="358" height="47" rx="17" fill="#e8f1ff"/>
<text x="882" y="205" font-size="14" fill="#2563a6" font-weight="700">3 / PREPARE</text>
<text x="882" y="257" font-size="24" fill="#172b4d" font-weight="700">Start the controller</text>
<text x="882" y="291" font-size="18" fill="#304a64">Keep persistent data and its CA.</text>
<text x="882" y="317" font-size="18" fill="#304a64">Prepare the pinned emOS image.</text>
<text x="882" y="343" font-size="18" fill="#304a64">Keep per-device credentials private.</text>
<text x="882" y="369" font-size="18" fill="#304a64">Result: host and recovery ready.</text>
<rect x="60" y="480" width="360" height="220" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="61" y="481" width="358" height="47" rx="17" fill="#ffebf2"/>
<text x="82" y="510" font-size="14" fill="#af3e68" font-weight="700">4 / MIGRATE</text>
<text x="82" y="562" font-size="24" fill="#172b4d" font-weight="700">Install, then approve</text>
<text x="82" y="596" font-size="18" fill="#304a64">Follow the exact USB procedure.</text>
<text x="82" y="622" font-size="18" fill="#304a64">Boot emOS and EchoMuse.</text>
<text x="82" y="648" font-size="18" fill="#304a64">Approve the authenticated device.</text>
<text x="82" y="674" font-size="18" fill="#304a64">Result: controller link established.</text>
<rect x="460" y="480" width="360" height="220" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="461" y="481" width="358" height="47" rx="17" fill="#f0ebff"/>
<text x="482" y="510" font-size="14" fill="#6d4ad1" font-weight="700">5 / ENROLL</text>
<text x="482" y="562" font-size="24" fill="#172b4d" font-weight="700">Connect Home Assistant</text>
<text x="482" y="596" font-size="18" fill="#304a64">Add the current voice endpoint.</text>
<text x="482" y="622" font-size="18" fill="#304a64">Assign the Assist pipeline.</text>
<text x="482" y="648" font-size="18" fill="#304a64">Add music and BLE if required.</text>
<text x="482" y="674" font-size="18" fill="#304a64">Result: current entities in HA.</text>
<rect x="860" y="480" width="360" height="220" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="861" y="481" width="358" height="47" rx="17" fill="#e2f6f1"/>
<text x="882" y="510" font-size="14" fill="#087f78" font-weight="700">6 / VERIFY</text>
<text x="882" y="562" font-size="24" fill="#172b4d" font-weight="700">Listen and compare</text>
<text x="882" y="596" font-size="18" fill="#304a64">Check voice on the same Dot.</text>
<text x="882" y="622" font-size="18" fill="#304a64">Compare home values with HA.</text>
<text x="882" y="648" font-size="18" fill="#304a64">Check music, stop and reconnect.</text>
<text x="882" y="674" font-size="18" fill="#304a64">Result: an attended test record.</text>
<text x="490" y="463" font-size="16" fill="#4b6178">Continue with this device’s own image and recovery copy</text>
<rect x="60" y="748" width="1160" height="132" rx="18" fill="#e2f6f1"/>
<text x="84" y="786" font-size="14" fill="#087f78" font-weight="700">TARGET RESULT</text>
<text x="84" y="821" font-size="27" fill="#172b4d" font-weight="700">Ordinary USB power + Wi-Fi for everyday use</text>
<text x="84" y="853" font-size="19" fill="#172b4d">Voice answers · reviewed home controls · statistics · optional music and Bluetooth</text>
<text x="60" y="936" font-size="14" fill="#4b6178">EchoMuse project guide · recorded baseline, not live device status</text>
</svg>
