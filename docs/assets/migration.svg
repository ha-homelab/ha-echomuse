<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">EchoMuse migration decision and checkpoints</title><desc id="desc">First identify the model and current software. Unknown hardware or missing recovery means stop before writing. For the verified RS03QR Fire OS 6 route, back up and verify recovery, build from the same device kernel, verify the targeted write, then enroll Home Assistant and perform attended acceptance. Existing emOS devices generally need configuration rather than a reflash.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526680"/></marker></defs>
<rect width="1200" height="1050" rx="24" fill="#f5f8fc"/>
<style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;} .h {font-size:34px;font-weight:700;fill:#172b4d} .k {font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#486680} .t {font-size:23px;font-weight:700;fill:#172b4d} .b {font-size:18px;fill:#284564} .s {font-size:16px;fill:#425e78} .edge {fill:none;stroke:#526680;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="50" y="52" class="k">MIGRATION / CHECKPOINTS</text>
<text x="50" y="100" class="h">Identify. Preserve. Install. Verify.</text>
<text x="50" y="132" class="s">The diagram summarizes the runbook; it is not a partition-write recipe.</text>
<rect x="50" y="180" width="810" height="120" rx="16" fill="#fff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="72" y="218" class="t">1  Identify the exact device</text>
<text x="72" y="254" class="b">Match Model + board + live private identity.</text>
<text x="72" y="280" class="b">Verify OS, unlock state, kernel and partition map.</text>
<rect x="50" y="345" width="810" height="120" rx="16" fill="#fff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="72" y="383" class="t">2  Prove recovery and preserve</text>
<text x="72" y="419" class="b">Test USB data access and recovery before writing.</text>
<text x="72" y="445" class="b">Take independent, verified backups; keep a second copy.</text>
<rect x="50" y="510" width="810" height="120" rx="16" fill="#fff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="72" y="548" class="t">3  Build for that device</text>
<text x="72" y="584" class="b">Use its own donor kernel and the pinned emOS assets.</text>
<text x="72" y="610" class="b">Stage firmware, credentials and compatible wake assets.</text>
<rect x="50" y="675" width="810" height="120" rx="16" fill="#fff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="72" y="713" class="t">4  Install through verified recovery</text>
<text x="72" y="749" class="b">Write only the resolved target; verify independent readback.</text>
<text x="72" y="775" class="b">Keep the original boot selection and recovery path.</text>
<rect x="50" y="840" width="810" height="120" rx="16" fill="#fff" stroke="#cbd7e6" stroke-width="1.5"/>
<text x="72" y="878" class="t">5  Enroll and test the complete path</text>
<text x="72" y="914" class="b">Approve the device; check TLS, HA and its Assist pipeline.</text>
<text x="72" y="940" class="b">Test button, wake, audible speech, music and reconnection.</text>
<path class="edge" d="M455 300 V340"/>
<path class="edge" d="M455 465 V505"/>
<path class="edge" d="M455 630 V670"/>
<path class="edge" d="M455 795 V835"/>
<rect x="915" y="180" width="235" height="165" rx="16" fill="#fff2df" stroke="#dec19b" stroke-width="1.5"/>
<text x="937" y="218" class="t">Stop and inspect</text>
<text x="937" y="254" class="b">Unknown model?</text>
<text x="937" y="280" class="b">Layout mismatch?</text>
<text x="937" y="306" class="b">No verified recovery?</text>
<path class="edge" d="M860 240 H910"/>
<rect x="915" y="390" width="235" height="180" rx="16" fill="#e8f4f3" stroke="#a2cfca" stroke-width="1.5"/>
<text x="937" y="428" class="t">Running emOS?</text>
<text x="937" y="464" class="b">Use configuration</text>
<text x="937" y="490" class="b">for voice, BLE, music</text>
<text x="937" y="516" class="b">and HA settings.</text>
<text x="937" y="542" class="b">No routine reflash.</text>
<rect x="915" y="630" width="235" height="180" rx="16" fill="#e8f4f3" stroke="#a2cfca" stroke-width="1.5"/>
<text x="937" y="668" class="t">Verified scope</text>
<text x="937" y="704" class="b">Echo Dot 2 RS03QR</text>
<text x="937" y="730" class="b">Fire OS 6 + amonet 2</text>
<text x="937" y="756" class="b">ARM32 kernel</text>
<text x="937" y="782" class="b">One unit at a time</text>
<text x="50" y="1006" class="s">Do not expand to another unit until the chosen acceptance checks pass. Retain per-device rollback.</text>
</svg>
